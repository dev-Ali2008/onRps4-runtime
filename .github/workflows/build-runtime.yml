name: build-runtime

# Rebuilds the shadPS4 runtime bundle (box64 + shadps4 guest binaries +
# rootfs) inside a Debian Trixie container — same environment the upstream
# Bachata-S4 pipeline uses — and repackages
# app/src/main/assets/runtime/{runtime.zip,manifest.json}.
#
# Download the "runtime-assets" artifact and drop both files into
# app/src/main/assets/runtime/ before building the APK in AndroidIDE.

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/patches/**"
      - "runtime/scripts/**"
      - "runtime/sources/**"
      - "runtime/probes/**"
      - ".github/workflows/build-runtime.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    timeout-minutes: 300

    steps:
      - name: Install git + node for checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git nodejs ca-certificates

      - uses: actions/checkout@v4

      # Official dependency list: multiarch arm64 libs, cross compilers,
      # clang/llvm, cmake/ninja, SDL2/vulkan dev — everything the scripts need.
      - name: Install Debian runtime build dependencies
        run: bash runtime/scripts/install-debian-runtime-deps.sh

      - name: Clean partial submodule clones
        run: |
          find runtime/sources/shadps4/externals -maxdepth 1 -type d -empty -delete || true
          rm -rf runtime/sources/shadps4/externals/zlib-ng

      - name: Populate shadPS4 externals submodules
        run: python3 runtime/scripts/populate-shadps4-submodules.py runtime/sources/shadps4

      - name: Build runtime (box64 + shadps4 x86_64/arm64 + Vortek + stage + package)
        env:
          FAST_FDROID_BUILD: "0"
        run: bash runtime/scripts/build-runtime-debian.sh app/src/main/assets/runtime
      - name: Verify manifest ↔ zip consistency
        run: python3 runtime/tests/verify-packaged-runtime.py app/src/main/assets/runtime


      - uses: actions/upload-artifact@v4
        with:
          name: runtime-assets
          path: |
            app/src/main/assets/runtime/runtime.zip
            app/src/main/assets/runtime/manifest.json
          if-no-files-found: error
